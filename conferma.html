<script>
(function () {
  var q = new URLSearchParams(location.search);
  var action = q.get('azione') === 'disiscrivi' ? 'unsubscribe' : 'confirm';
  var token = q.get('t') || '';
  var $ = function (id) { return document.getElementById(id); };
  function done(title, text) { $('spin').hidden = true; $('title').textContent = title; $('text').textContent = text; $('back').hidden = false; }
  var cfg = window.MAISTU_CONFIG || {};
  var base = String(cfg.supabaseUrl || '').replace(/\/$/, '');
  if (!/^[A-Za-z0-9-]{20,80}$/.test(token)) { done('Link non valido', 'Il link che hai aperto non è completo. Copialo per intero dall\u2019email e riprova.'); return; }
  fetch(base + '/functions/v1/newsletter', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: action, token: token, sito: 'maistu' }) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error); return j; }); })
    .then(function () {
      if (action === 'confirm') done('Iscrizione confermata!', 'Grazie: d\u2019ora in poi riceverai le novità di Maistu. Poche email, solo quando hanno qualcosa da dire.');
      else done('Disiscrizione completata', 'Non riceverai più le novità di Maistu. Se cambi idea, puoi iscriverti di nuovo dal sito quando vuoi.');
    })
    .catch(function () { done('Qualcosa non ha funzionato', 'Il link potrebbe essere scaduto o già usato. Se il problema continua scrivi a privacy@domotty.it.'); });
})();
</script>
